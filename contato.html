<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Contato — Jornada Viagens</title>
  </head>
  <body>
    <header class="main-header">
      <a class="logo" href="index.html" title="voltar para a página inicial">
        <img class="img-mobile" src="img/bussola-jornada-branco.png" alt="logo móvel" />
        <img class="img-desktop" src="img/bussola-texto-jornada-branco.png" alt="logo desktop" />
      </a>
      <div class="navigation-menu">
        <input type="checkbox" id="menu" hidden />
        <label for="menu"><img src="img/menu.png" alt="menu" /></label>
        <nav>
          <ul class="list-links">
            <li><a href="blog.html">Blog</a></li>
            <li><a href="pacotes-de-viagens.html">Pacotes de viagem</a></li>
            <li><a href="contato.html" class="active">Contato</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="content">
      <section class="section-title">
        <h2>Contato</h2>
        <hr />
      </section>

      <section class="contact-form">
        <form action="#" method="post">
          <label for="name">Nome</label>
          <input id="name" name="name" type="text" required />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />

          <label for="message">Mensagem</label>
          <textarea id="message" name="message" rows="6" required></textarea>

          <button type="submit" class="button">Enviar</button>
        </form>
      </section>
    </main>

    <footer class="main-footer">
      <div class="footer-content">
        <img src="img/logo-footer.png" alt="logo completo Jornada Viagens" />
        <p>Desenvolvido por Alura. Projeto fictício sem fins comerciais.</p>
      </div>
    </footer>
  </body>
</html>
